<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administrador</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 40px auto; background: white; border-radius: 10px; padding: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { margin: 0; color: #1a237e; }
        .card { background: #e8eaf6; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .card h2 { margin-top: 0; }
        .logout-button { background: #d32f2f; color: white; border: none; padding: 12px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .info-list { list-style: none; padding: 0; margin: 0; }
        .info-list li { margin: 8px 0; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>Panel de Administrador</h1>
            <p>Bienvenido, <span th:text="${adminLogueado.nombre} + ' ' + ${adminLogueado.apellido}">Administrador</span></p>
        </div>
        <form th:action="@{/logout}" method="POST">
            <button type="submit" class="logout-button">Cerrar Sesión</button>
        </form>
    </header>

    <div class="card">
        <h2>Información del Administrador</h2>
        <ul class="info-list">
            <li><strong>Correo:</strong> <span th:text="${adminLogueado.email}">admin@vlc.com</span></li>
            <li><strong>Nivel de acceso:</strong> <span th:text="${adminLogueado.nivelAcceso}">1</span></li>
            <li><strong>Rol:</strong> Administrador</li>
        </ul>
    </div>

    <div class="card">
        <h2>Acciones disponibles</h2>
        <p>Aquí puedes mostrar informes, métricas, gestión de usuarios o enlaces a módulos administrativos.</p>
    </div>
</div>
</body>
</html>
