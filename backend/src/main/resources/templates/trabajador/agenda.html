<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Trabajador</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fb; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 40px auto; background: white; border-radius: 10px; padding: 28px; box-shadow: 0 8px 18px rgba(0,0,0,0.08); }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        h1 { margin: 0; color: #0d47a1; }
        .logout-button { background: #c62828; color: white; border: none; padding: 12px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .card { background: #e3f2fd; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .info-list { list-style: none; padding: 0; margin: 0; }
        .info-list li { margin: 8px 0; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>Agenda del Trabajador</h1>
            <p>Hola, <span th:text="${trabajadorLogueado.nombre} + ' ' + ${trabajadorLogueado.apellido}">Trabajador</span></p>
        </div>
        <form th:action="@{/logout}" method="POST">
            <button type="submit" class="logout-button">Cerrar Sesión</button>
        </form>
    </header>

    <div class="card">
        <h2>Datos del Trabajador</h2>
        <ul class="info-list">
            <li><strong>Correo:</strong> <span th:text="${trabajadorLogueado.email}">trabajador@vlc.com</span></li>
            <li><strong>Especialidad:</strong> <span th:text="${trabajadorLogueado.especialidad}">Mecánica general</span></li>
            <li><strong>Disponibilidad:</strong>
                <span th:text="${trabajadorLogueado.disponibilidad} ? 'Disponible' : 'No disponible'">Disponible</span>
            </li>
            <li><strong>Rol:</strong> Trabajador</li>
        </ul>
    </div>

    <div class="card">
        <h2>Agenda de trabajo</h2>
        <p>Aquí puedes mostrar las citas asignadas, tareas pendientes y el estado de cada servicio.</p>
    </div>
</div>
</body>
</html>
